
<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD 130 | HTML Form - User Poll</title>
  <meta name="description" content="WDD 130 HTML Form - Quiz example">
  <meta name="author" content="Mary Walter">
  <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
  <header>
    <h1>WDD 130 | Mary Walter | HTML Form - User Poll</h1>
  </header>
  <main>
    <form>
      <fieldset>
        <legend>Questions</legend>

        <div class="form-item column1">
          <label for="q1">1. What does the acronym CSS stand for?</label>
          <input type="text" id="q1" name="q1">
        </div>

        <div class="form-item column1">
          <label for="q2">2. How are id and class attributes selected in CSS?</label>
          <textarea id="q2" name="q2" rows="4" placeholder="Type your answer here..."></textarea>
        </div>

        <div class="form-item column1">
          <label for="q3">3. Which of the following is a valid CSS comment?</label>
          <select id="q3" name="q3">
            <option value="" selected disabled>Choose One ...</option>
            <option value="option1">&lt;!-- This is a comment --&gt;</option>
            <option value="option2">/* This is a comment */</option>
            <option value="option3">// This is a comment</option>
          </select>
        </div>

        <div class="form-item column1">
          <label for="q4">4. What is the bottom margin given this declaration?</label>
          <p class="code">margin: 10px 5px 15px;</p>
          <input type="number" id="q4" name="q4" min="0" max="20">
        </div>

      </fieldset>
      <button type="submit">Submit Poll</button>
    </form>
  </main>
  <footer>
    <p>&copy;2026 🌴 Mary Walter 🌴 WDD 130</p>
  </footer>
</body>
</html>

<section class="employees">
<h2>Meet Our Team</h2>
<figure>
<img src="images/rafting1.jpeg" alt="Smiling employee helping customers">
<figcaption>Sarah - Customer Service Manager</figcaption>
</figure>
<figure>
<img src="images/rafting2.jpeg" alt="Happy rafting guide">
<figcaption>James - Lead Rafting Guide</figcaption>
</figure>
<figure>
<img src="images/rafting3.jpeg" alt="Friendly reservations staff">
<figcaption>Mary - Reservations Coordinator</figcaption>
</figure>
</section>

<section class="contact-form">
<h2>Send Us a Message</h2>
<form action="#" method="post">
<label for="name">Name:</label>
<input type="text" id="name" name="name" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required>

<p>Purpose of your message:</p>
<input type="radio" id="purpose-general" name="purpose" value="general" checked>
<label for="purpose-general">General Inquiry</label><br>
<input type="radio" id="purpose-reservation" name="purpose" value="reservation">
<label for="purpose-reservation">Reservation Question</label><br>
<input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
<label for="purpose-suggestion">Website Suggestion</label><br>

<label for="message">Message:</label>
<textarea id="message" name="message" rows="5" required></textarea>

<input type="checkbox" id="subscribe" name="subscribe">
<label for="subscribe">Please subscribe me to the monthly newsletter</label>

<button type="submit">Send Message</button>
</form>
</section>
